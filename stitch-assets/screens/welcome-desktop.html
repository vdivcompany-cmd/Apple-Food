<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TableChat - Order</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "primary-fixed-dim": "#ffb693",
                            "surface-container": "#efeeea",
                            "surface": "#fbf9f5",
                            "tertiary": "#934b19",
                            "surface-container-highest": "#e4e2de",
                            "primary-container": "#ff6b00",
                            "on-tertiary-fixed": "#321200",
                            "on-background": "#1b1c1a",
                            "surface-dim": "#dbdad6",
                            "inverse-primary": "#ffb693",
                            "error": "#ba1a1a",
                            "on-primary-fixed": "#351000",
                            "inverse-surface": "#30312e",
                            "on-error-container": "#93000a",
                            "on-tertiary-container": "#532300",
                            "on-secondary-fixed": "#1c1b1b",
                            "on-secondary-fixed-variant": "#474646",
                            "outline-variant": "#e2bfb0",
                            "on-primary": "#ffffff",
                            "background": "#fbf9f5",
                            "on-surface-variant": "#5a4136",
                            "on-tertiary": "#ffffff",
                            "outline": "#8e7164",
                            "secondary-container": "#e5e2e1",
                            "primary-fixed": "#ffdbcc",
                            "secondary-fixed": "#e5e2e1",
                            "on-primary-container": "#572000",
                            "on-surface": "#1b1c1a",
                            "on-secondary-container": "#656464",

                            "on-tertiary-fixed-variant": "#753401"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "base": "8px",
                            "margin-desktop": "48px",
                            "margin-mobile": "16px",
                            "gutter": "16px",
                            "lg": "24px",
                            "sm": "12px",
                            "xs": "4px",
                            "xl": "32px",
                            "md": "16px"
                    },
                    "fontFamily": {
                            "headline-lg-mobile": ["Plus Jakarta Sans"],
                            "chat-text": ["Plus Jakarta Sans"],
                            "body-lg": ["Plus Jakarta Sans"],

                    "fontSize": {
                            "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                },
            },

<body class="h-full bg-background text-on-surface font-body-md overflow-hidden antialiased">
<!-- TopNavBar -->
<header class="bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-xl shadow-sm flex justify-between items-center px-margin-mobile md:px-margin-desktop w-full h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">TableChat</span>
</div>
<div class="hidden md:flex items-center gap-8 h-full">
<button class="h-full text-primary font-bold border-b-2 border-primary hover:opacity-80 transition-opacity">Chat</button>
<button class="h-full text-secondary dark:text-secondary-fixed hover:opacity-80 transition-opacity">My Order</button>
</div>
<div class="flex items-center gap-4">
<span class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim">Table 10</span>
<button class="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md text-label-md hover:opacity-80 transition-opacity">Live Session</button>
</div>
</header>
<div class="flex h-[calc(100vh-4rem)]">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col h-full p-lg gap-md bg-surface-container-low dark:bg-inverse-surface shadow-md w-80 fixed left-0 top-16 overflow-y-auto z-40">
<div class="flex items-center gap-sm mb-4">
<img class="w-12 h-12 rounded-full object-cover" data-alt="A small, high-quality, modern, minimalist logo for a sun-drenched bistro. Soft, warm tones on a light background. Inviting and appetizing. The design is simple and scalable." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCETsox3iV4lcXSzk5Od-rm_SCxRIBuh7Q9vxJXASm9kyXLb2mSv-0ib0QquVHNIEm414-pv3D4YJz2_JUauVWaJfhHEKPIXStW9VdYPB80skkTR1I2dBwgUOHPQ_Y1HIk6l_ZOAXv7QOfHzPj4ilbp3vEUonJ2NvTQwphPRO_Z1evOmqjRmhq7ldZxKPV23pMBQp5f-UcRks6DKQ5jd86335XcSLkcvxDbg8SDq4ixRGTbeGmomdZ7Vg"/>
<div>
<h2 class="font-headline-sm text-headline-sm font-bold text-on-surface">Menu</h2>
<p class="text-on-surface-variant font-body-md text-sm">Browse Categories</p>
</div>
</div>
<!-- Search -->
<div class="relative mb-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="Search menu..." type="text"/>
</div>
<nav class="flex flex-col gap-2 flex-grow">
<button class="flex items-center gap-3 bg-primary-container text-on-primary-container font-bold rounded-lg px-4 py-3 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="appetizer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">play_games</span>
                    Starters
                </button>
<button class="flex items-center gap-3 text-on-surface-variant dark:text-on-secondary-fixed-variant px-4 py-3 rounded-lg hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="flatware">flatware</span>
                    Mains
                </button>
<button class="flex items-center gap-3 text-on-surface-variant dark:text-on-secondary-fixed-variant px-4 py-3 rounded-lg hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="icecream">icecream</span>
                    Desserts
                </button>
<button class="flex items-center gap-3 text-on-surface-variant dark:text-on-secondary-fixed-variant px-4 py-3 rounded-lg hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="local_bar">local_bar</span>
                    Drinks
                </button>
<button class="flex items-center gap-3 text-on-surface-variant dark:text-on-secondary-fixed-variant px-4 py-3 rounded-lg hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
                    Sides
                </button>
</nav>
<button class="mt-auto w-full bg-surface-variant text-on-surface py-3 rounded-xl font-label-md hover:bg-surface-dim transition-colors">
                View Specials
            </button>
</aside>
<!-- Main Chat Panel -->
<main class="flex-1 ml-0 md:ml-80 flex flex-col h-full bg-surface relative">
<!-- Empty State / Welcome -->
<div class="flex-1 overflow-y-auto p-4 md:p-lg flex flex-col items-center justify-center">
<div class="max-w-2xl w-full text-center space-y-6">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary-fixed rounded-full mb-4 shadow-[0px_4px_20px_rgba(18,18,18,0.04)]">
<span class="material-symbols-outlined text-4xl text-primary">waving_hand</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome to <span class="text-primary">Bistro Sun</span>, Table 10!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">
                        We're glad you're here. How can we get your meal started today?
                    </p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-2xl shadow-[0px_4px_20px_rgba(18,18,18,0.04)] hover:scale-[0.98] transition-transform border border-transparent hover:border-primary-fixed group cursor-pointer">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">restaurant_menu</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface">View Menu</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Browse our delicious selection of dishes.</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-lowest rounded-2xl shadow-[0px_4px_20px_rgba(18,18,18,0.04)] hover:scale-[0.98] transition-transform border border-transparent hover:border-primary-fixed group cursor-pointer">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-on-surface group-hover:text-primary transition-colors">history</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface">Reorder Last Order</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Get your usual favorites again quickly.</span>
</button>
</div>
</div>
</div>
<!-- Chat Input -->
<div class="p-4 md:p-6 bg-surface/90 backdrop-blur-md border-t border-surface-variant z-10 w-full max-w-4xl mx-auto self-center pb-safe-bottom">
<div class="flex items-center gap-2 bg-surface-container-lowest rounded-full shadow-[0px_8px_30px_rgba(18,18,18,0.08)] border border-outline-variant p-2 focus-within:border-primary transition-colors min-h-[64px]">
<button class="p-3 text-secondary hover:text-primary transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">add</span>
</button>
<input class="flex-1 bg-transparent border-none outline-none font-chat-text text-chat-text text-on-surface placeholder:text-on-surface-variant focus:ring-0 px-2" placeholder="Type your order or ask about a dish..." type="text"/>
<button class="p-3 bg-primary text-on-primary rounded-full hover:scale-95 transition-transform flex items-center justify-center w-12 h-12">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</main>
</div>
<style>
        .pb-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
